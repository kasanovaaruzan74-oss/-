services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/deanflow-labs.db
      AUTH_REQUIRED: "${AUTH_REQUIRED:-false}"
      DEANFLOW_ADMIN_EMAIL: "${DEANFLOW_ADMIN_EMAIL:-dana@example.invalid}"
      DEANFLOW_ADMIN_PASSWORD: "${DEANFLOW_ADMIN_PASSWORD:-}"
    ports:
      - "127.0.0.1:${DEANFLOW_API_PORT:-8000}:8000"
    volumes:
      - deanflow-demo-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${DEANFLOW_UI_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  deanflow-demo-data:
