name: Python тексерістері

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Репозиторийді жүктеу
        uses: actions/checkout@v4
      - name: Python ортасын орнату
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Жоба тәуелділіктерін орнату
        run: python -m pip install -r requirements.txt "bandit>=1.8,<2"
      - name: API, кіру және дерекқор транзакцияларын тексеру
        run: python -m pytest -v --junitxml=pytest.xml
      - name: Қолданба кодын статикалық талдау
        run: python -m bandit -q -r app
      - name: pytest есебін сақтау
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest.xml
