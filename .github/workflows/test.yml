name: Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt "bandit>=1.8,<2"
      - name: Test API, authentication, and database transactions
        run: python -m pytest -v --junitxml=pytest.xml
      - name: Static check of application code
        run: python -m bandit -q -r app
      - name: Save pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest.xml
